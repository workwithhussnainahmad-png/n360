# Local k6 override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.k6.yml up -d --build
#
# - Publishes Caddy on http://localhost:3000 to distribute traffic to app and app2
# - Keeps local token preparation's database/cache ports reachable on loopback
# - Skips postgres-backup to free RAM under an 8GB WSL cap

services:
  app:
    environment:
      # Diagnostic run observed a 10-client pool queuing up to 99 requests while
      # PgBouncer had zero queued clients. Keep this local adjustment explicit.
      DB_POOL_MAX: 15
      HOT_PATH_LANE_ROUTES: /api/student/dashboard,/api/student/timetable,/api/student/profile,/api/staff/dashboard,/api/staff/timetable,/api/staff/profile,/api/institution/dashboard,/api/institution/dashboard/charts,/api/institution/academics,/api/institution/timetable,/api/parent/portal,/api/student/attendance,/api/student/marks,/api/student/submissions,/api/staff/attendance,/api/staff/marks,/api/staff/assignments
    healthcheck:
      timeout: 10s

  app2:
    environment:
      DB_POOL_MAX: 15
      HOT_PATH_LANE_ROUTES: /api/student/dashboard,/api/student/timetable,/api/student/profile,/api/staff/dashboard,/api/staff/timetable,/api/staff/profile,/api/institution/dashboard,/api/institution/dashboard/charts,/api/institution/academics,/api/institution/timetable,/api/parent/portal,/api/student/attendance,/api/student/marks,/api/student/submissions,/api/staff/attendance,/api/staff/marks,/api/staff/assignments
    healthcheck:
      timeout: 10s

  pgbouncer:
    ports:
      - "127.0.0.1:6432:6432"

  valkey:
    ports:
      - "127.0.0.1:6379:6379"

  caddy:
    ports: !override
      - "3000:3000"
    volumes:
      - ./Caddyfile.k6:/etc/caddy/Caddyfile:ro

  postgres-backup:
    profiles: ["with-backup"]

  institution-restore-worker:
    profiles: ["with-backup"]
